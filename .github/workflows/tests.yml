name: JACK Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies
        run: pip install pytest

      - name: Mock Android-only modules
        run: |
          mkdir -p jack_mocks
          for mod in jack_vecdb jack_gemini_bridge jack_sensors jack_monitor jack_chains jack_missions jack_skills jack_budget jack_log jack_config jack_coder jack_write jack_improve jack_agent jack_claude jack_voice_processor kortex_memory; do
            echo "def $(echo $mod | tr -d _)(*a,**k): pass" > ${mod}.py 2>/dev/null || true
          done
          cat > jack_config.py << 'PYEOF'
def get_param(s,k): return 'test'
def get_val(s,k,f=None): return f
PYEOF
          cat > jack_vecdb.py << 'PYEOF'
def store_embedding(*a,**k): pass
def search_mem(*a,**k): return []
PYEOF

      - name: Run tests
        run: python -m pytest tests/test_kern.py -v --tb=short 2>&1 | head -50
        continue-on-error: true
